services:
  fmt:
    image: ${FMT_IMAGE:-ghcr.io/janschachtschabel/facettierte-methodentaxonomie:latest}
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8120}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      DOMAIN: "${DOMAIN:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      # Optional: Server-LLM (strikt opt-in über LLM_API_KEY; leer = Zero-LLM-Modus)
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-6-luna}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_USE_OPENAI_ENV: "${LLM_USE_OPENAI_ENV:-false}"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-low}"
      LLM_ALLOW_BYOK: "${LLM_ALLOW_BYOK:-true}"
      LLM_RATE_LIMIT_PER_MIN: "${LLM_RATE_LIMIT_PER_MIN:-20}"
      API_RATE_LIMIT_PER_MIN: "${API_RATE_LIMIT_PER_MIN:-300}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-90000}"
      LLM_CACHE_MAX: "${LLM_CACHE_MAX:-500}"
      LLM_CACHE_TTL_MS: "${LLM_CACHE_TTL_MS:-3600000}"
      # Optional: Kontaktformular im Impressum (Versand per SMTP; ohne SMTP_HOST meldet das Formular "nicht eingerichtet")
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      CONTACT_FROM: "${CONTACT_FROM:-}"
      CONTACT_TO: "${CONTACT_TO:-}"
      CONTACT_RATE_LIMIT_PER_HOUR: "${CONTACT_RATE_LIMIT_PER_HOUR:-10}"
      # Optional: lokales Model2Vec-Modell im Volume (/app/models/m2v-qwen3-4b-256-edu)
      FMT_M2V_MODEL_DIR: "${FMT_M2V_MODEL_DIR:-/app/models/m2v-qwen3-4b-256-edu}"
    volumes:
      - fmt-models:/app/models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-fmt-methodendatenbank-web}"
      - "traefik.http.routers.fmt-methodendatenbank.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.fmt-methodendatenbank.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fmt-methodendatenbank.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.fmt-methodendatenbank.loadbalancer.server.port=8080"

volumes:
  fmt-models:

networks:
  default:
    name: ${TRAEFIK_NETWORK:-fmt-methodendatenbank-web}
