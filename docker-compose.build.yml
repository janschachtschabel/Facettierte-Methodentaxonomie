services:
  fmt:
    build: .
    image: fmt-methodendatenbank:local
    restart: unless-stopped
    # Logs stay small and are overwritten continuously (see the privacy page).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-6-luna}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_USE_OPENAI_ENV: "${LLM_USE_OPENAI_ENV:-false}"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-low}"
      LLM_ALLOW_BYOK: "${LLM_ALLOW_BYOK:-true}"
      LLM_RATE_LIMIT_PER_MIN: "${LLM_RATE_LIMIT_PER_MIN:-20}"
      API_RATE_LIMIT_PER_MIN: "${API_RATE_LIMIT_PER_MIN:-300}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-90000}"
      LLM_CACHE_MAX: "${LLM_CACHE_MAX:-500}"
      LLM_CACHE_TTL_MS: "${LLM_CACHE_TTL_MS:-3600000}"
      FMT_M2V_MODEL_DIR: "${FMT_M2V_MODEL_DIR:-/app/models/m2v-qwen3-4b-256-edu}"
    volumes:
      - fmt-models:/app/models

volumes:
  fmt-models:
